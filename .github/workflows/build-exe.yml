name: Build ReelForge.exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows app
        run: dotnet publish ReelForge.sln -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath ReelForge-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ReelForge-windows
          path: ReelForge-windows.zip
      - name: Configure native C++ editor
        shell: pwsh
        run: |
          if (-not (Get-Command mingw32-make -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
          }
          cmake -S Native/ReelForgeNative -B Native/ReelForgeNative/build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
      - name: Build native C++ editor
        run: cmake --build Native/ReelForgeNative/build --parallel 2
      - name: Package native C++ editor
        shell: pwsh
        run: |
          $exe = Get-ChildItem Native\ReelForgeNative\build -Filter ReelForgeNative.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "ReelForgeNative.exe was not produced" }
          Compress-Archive -Path $exe.FullName -DestinationPath ReelForge-native-cpp-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ReelForge-native-cpp-windows
          path: ReelForge-native-cpp-windows.zip